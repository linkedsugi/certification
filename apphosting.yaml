# Firebase App Hosting — backend configuration
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  cpu: 1
  memoryMiB: 512
  maxInstances: 5
  minInstances: 0
  concurrency: 80

env:
  # Database — Neon Postgres connection string.
  # Set the secret in the Firebase Console (App Hosting → Backend → Secrets).
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - BUILD
      - RUNTIME

  # Next.js standard.
  - variable: NODE_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

# Firebase App Hosting auto-detects Next.js and runs `npm run build`. We
# override to use `build:firebase` which swaps the Prisma datasource provider
# to postgresql and pushes the schema to Neon before building Next.js.
buildConfig:
  runtime: nodejs20
  commands:
    - npm ci
    - npm run build:firebase
